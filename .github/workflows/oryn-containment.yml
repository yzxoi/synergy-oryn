name: Oryn Native Containment

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks without Docker
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Build helper from the candidate
        run: |
          cargo test --locked --manifest-path packages/synergy/src/sandbox/helper-linux/Cargo.toml
          cargo build --locked --release --manifest-path packages/synergy/src/sandbox/helper-linux/Cargo.toml
          mkdir -p "$HOME/.synergy/sandbox-helper"
          cp packages/synergy/src/sandbox/helper-linux/target/release/synergy-sandbox-linux "$HOME/.synergy/sandbox-helper/"
      - name: Exercise the actual Oryn sandbox and scheduler
        working-directory: packages/synergy
        run: bun test test/oryn/sandbox.test.ts test/oryn/workspaces.test.ts test/sandbox/explicit-profile.test.ts
