name: Oryn Native Containment

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks without Docker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build helper from the candidate
        run: |
          cargo test --locked --manifest-path packages/synergy/src/sandbox/helper-linux/Cargo.toml
          bash script/prepare-linux-test-sandbox.sh
      - name: Start the user resource manager
        run: |
          oryn_unit="user@$(id -u).service"
          trap 'sudo systemctl status "$oryn_unit" --no-pager --full || true; sudo journalctl --boot --unit "$oryn_unit" --no-pager --lines=80 || true' ERR
          sudo systemctl stop "$oryn_unit"
          sudo install -d "/run/systemd/system/${oryn_unit}.d"
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "/run/systemd/system/${oryn_unit}.d/oryn.conf" > /dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "$oryn_unit"
      - name: Exercise the actual Oryn sandbox and scheduler
        env:
          SYNERGY_TEST_ORYN_CGROUP: "1"
        working-directory: packages/synergy
        run: bun run test test/oryn/shell.test.ts test/oryn/sandbox.test.ts test/oryn/experiment.test.ts test/oryn/dependencies.test.ts test/oryn/resource-limits.test.ts test/oryn/workspaces.test.ts test/oryn/review.test.ts test/sandbox/explicit-profile.test.ts test/sandbox/backend.test.ts test/sandbox/linux-multi-root.test.ts
      - name: Exercise worker recovery, candidate preparation and scripted pipelines
        working-directory: packages/synergy
        run: bun run test test/channel/provider/github/oryn-push.test.ts test/oryn/worker-start.test.ts test/oryn/candidate.test.ts test/oryn/success-pipeline.test.ts test/oryn/process-restart.test.ts test/oryn/pr-restart.test.ts
